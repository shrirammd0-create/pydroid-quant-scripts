name: Gold Quant Data Pipeline

on:
  workflow_dispatch:

jobs:
  run-quant-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Gold Quant Pipeline
        run: python gold_quant_pipeline.py
